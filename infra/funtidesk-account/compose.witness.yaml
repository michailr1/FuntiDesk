# Separate project on DE. No main database, account encryption key or MCP data.
services:
  witness:
    image: ${FUNTI_ACCOUNT_IMAGE:?verified account image required}
    pull_policy: never
    command: [witness]
    restart: unless-stopped
    user: '10002:10002'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    environment:
      FUNTI_ACCOUNT_WITNESS_KEY_FILE: /secrets/witness.key
      FUNTI_ACCOUNT_WITNESS_NAMESPACE: ${FUNTI_ACCOUNT_WITNESS_NAMESPACE:?initialized independent namespace required}
      FUNTI_WITNESS_DIRECTORY: /data/witness
      FUNTI_WITNESS_LISTEN: 0.0.0.0:21802
    volumes:
      - ${FUNTI_WITNESS_ROOT:-/opt/funtidesk-account-witness}/data:/data
      - ${FUNTI_WITNESS_ROOT:-/opt/funtidesk-account-witness}/secrets/witness.key:/secrets/witness.key:ro
    networks:
      witness:
        aliases: [funtidesk-account-witness]

  caddy:
    image: caddy@sha256:748016f285ed8c43a9ce6e3aed6d92d3009d90ca41157950880f40beaf3ff62b
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    ports:
      - '${FUNTI_WITNESS_BIND_IP:-0.0.0.0}:8446:8446/tcp'
    volumes:
      - ./Caddyfile.witness.proposed:/etc/caddy/Caddyfile:ro
      - ${FUNTI_WITNESS_TLS_DIRECTORY:?own certificate directory required}:/certs:ro
    tmpfs:
      - /data:mode=0700
      - /config:mode=0700
    networks:
      witness: {}

networks:
  witness:
    internal: true
    ipam:
      config:
        - subnet: ${FUNTI_WITNESS_SUBNET:-172.31.253.0/29}
