# FuntiDesk: only DNAT HTTPS to the verified public IPv4 of desk.funti.cc.
# INPUT protection is retained. The existing bouncer manages its own jumps/sets.
[Unit]
After=docker.service
PartOf=docker.service

[Service]
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -w -S FUNTIDESK_HTTPS_CS >/dev/null 2>&1 || /usr/sbin/iptables -w -N FUNTIDESK_HTTPS_CS'
ExecStartPre=/bin/sh -c '/usr/sbin/ip6tables -w -S FUNTIDESK_HTTPS_CS >/dev/null 2>&1 || /usr/sbin/ip6tables -w -N FUNTIDESK_HTTPS_CS'
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -w -C DOCKER-USER -p tcp -m conntrack --ctstate DNAT --ctorigdst __PUBLIC_V4__ --ctorigdstport 443 -m comment --comment funtidesk-crowdsec-https -j FUNTIDESK_HTTPS_CS 2>/dev/null || /usr/sbin/iptables -w -I DOCKER-USER 1 -p tcp -m conntrack --ctstate DNAT --ctorigdst __PUBLIC_V4__ --ctorigdstport 443 -m comment --comment funtidesk-crowdsec-https -j FUNTIDESK_HTTPS_CS'
