services:
  hbbs:
    # FUNTIDESK ADR-004: own build, created by scripts/server/build-image.sh
    # from the release pinned in server-release.env.
    image: funtidesk-server:${FUNTIDESK_SERVER_RELEASE:?set by server-release.env}
    pull_policy: never
    container_name: funtidesk-hbbs
    # FUNTIDESK: require server-key verification explicitly; do not rely on upstream defaults.
    command: ["hbbs", "-r", "${FUNTIDESK_FQDN}:21117", "-k", "_"]
    restart: unless-stopped
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
    volumes:
      - "${FUNTIDESK_DATA_DIR:-/opt/funtidesk/data}:/root"
    networks:
      - funtidesk

  hbbr:
    # FUNTIDESK ADR-004: own build, created by scripts/server/build-image.sh
    # from the release pinned in server-release.env.
    image: funtidesk-server:${FUNTIDESK_SERVER_RELEASE:?set by server-release.env}
    pull_policy: never
    container_name: funtidesk-hbbr
    # FUNTIDESK: never expose a keyless public relay.
    command: ["hbbr", "-k", "_"]
    restart: unless-stopped
    depends_on:
      - hbbs
    ports:
      - "21117:21117/tcp"
    volumes:
      - "${FUNTIDESK_DATA_DIR:-/opt/funtidesk/data}:/root"
    networks:
      - funtidesk

networks:
  funtidesk:
    name: funtidesk-server
