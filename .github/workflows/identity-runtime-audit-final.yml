name: identity-runtime-audit-final

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 1
      - name: Runtime identity candidates
        shell: bash
        run: |
          set -u
          grep -RInE \
            --exclude-dir=.dart_tool --exclude-dir=build --exclude-dir=target --exclude-dir=lang \
            --exclude='*.lock' --exclude='Cargo.toml' --exclude='pubspec.yaml' \
            'RustDesk|RUSTDESK|rustdesk|com\.carriez|Purslane' \
            client/flutter/android client/flutter/ios client/flutter/macos client/flutter/linux \
            client/src client/libs/hbb_common/src/config.rs \
            2>/dev/null | head -n 800 || true
