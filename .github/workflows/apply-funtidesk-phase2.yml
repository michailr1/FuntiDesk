name: Apply FuntiDesk Phase 2 product branding patch

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor
    paths:
      - ".github/workflows/apply-funtidesk-phase2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/ci/apply-funtidesk-phase2-aux.py

      - name: Format changed Rust files
        run: rustfmt --edition 2021 client/src/lang.rs client/src/auth_2fa.rs client/src/clipboard.rs client/libs/hbb_common/src/platform/mod.rs

      - name: Validate hbb_common
        working-directory: client
        run: cargo check -p hbb_common --lib --locked

      - name: Validate patch
        run: |
          git diff --check
          git diff -- client/src/lang.rs client/src/auth_2fa.rs client/src/clipboard.rs client/libs/hbb_common/src/platform/mod.rs client/flutter/windows/runner/main.cpp client/flutter/windows/runner/flutter_window.cpp client/flutter/lib/common.dart

      - name: Audit remaining product identity strings
        run: |
          git grep -n -E 'RustDesk|rustdesk' -- client/src client/libs/hbb_common/src client/flutter/windows client/flutter/lib scripts/windows ':(exclude)client/src/lang/**' \
            | grep -vE 'https?://|github.com/rustdesk|rustdesk-org' \
            | head -n 300 || true

      - name: Commit phase 2 product branding patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lang.rs client/src/auth_2fa.rs client/src/clipboard.rs client/libs/hbb_common/src/platform/mod.rs client/flutter/windows/runner/main.cpp client/flutter/windows/runner/flutter_window.cpp client/flutter/lib/common.dart
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "identity: remove remaining product-facing RustDesk branding"
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
