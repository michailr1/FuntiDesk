name: Apply FuntiDesk auxiliary migration hardening

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor
    paths:
      - ".github/workflows/apply-funtidesk-aux-migration-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/ci/apply-funtidesk-aux-migration-hardening.py

      - name: Format and validate
        run: |
          rustfmt --edition 2021 client/libs/hbb_common/src/config.rs
          git diff --check
          ! grep -Fq 'fs::copy(' client/libs/hbb_common/src/config.rs
          test "$(grep -Fc 'Config::copy_legacy_config_file' client/libs/hbb_common/src/config.rs)" -eq 4
          grep -Fq 'Self::copy_legacy_config_file' client/libs/hbb_common/src/config.rs

      - name: Test config module
        working-directory: client
        run: cargo test -p hbb_common --lib config::tests --locked

      - name: Commit auxiliary migration hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/libs/hbb_common/src/config.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "identity: harden auxiliary legacy migrations"
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
