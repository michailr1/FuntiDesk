name: identity-apple-runtime-patcher

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Patch Apple runtime identity
        shell: python
        run: |
          from pathlib import Path

          ios = Path('client/flutter/ios/Runner.xcodeproj/project.pbxproj')
          text = ios.read_text()
          old = 'PRODUCT_BUNDLE_IDENTIFIER = com.carriez.flutterHbb;'
          new = 'PRODUCT_BUNDLE_IDENTIFIER = cc.funti.funtidesk;'
          count = text.count(old)
          if count not in (0, 3):
              raise SystemExit(f'unexpected iOS bundle-id count: {count}')
          if count == 3:
              text = text.replace(old, new)
              ios.write_text(text)

          mac = Path('client/flutter/macos/Runner.xcodeproj/project.pbxproj')
          text = mac.read_text()
          old = 'RustDesk.app'
          new = 'FuntiDesk.app'
          count = text.count(old)
          if count not in (0, 3):
              raise SystemExit(f'unexpected macOS product-name count: {count}')
          if count == 3:
              text = text.replace(old, new)
              mac.write_text(text)

          if 'PRODUCT_BUNDLE_IDENTIFIER = com.carriez.flutterHbb;' in ios.read_text():
              raise SystemExit('legacy iOS bundle id remains')
          if 'RustDesk.app' in mac.read_text():
              raise SystemExit('legacy macOS app product remains')

      - name: Validate diff
        run: |
          git diff --check
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = cc.funti.funtidesk;' client/flutter/ios/Runner.xcodeproj/project.pbxproj
          grep -Fq 'FuntiDesk.app' client/flutter/macos/Runner.xcodeproj/project.pbxproj
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = cc.funti.funtidesk' client/flutter/macos/Runner/Configs/AppInfo.xcconfig

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/flutter/ios/Runner.xcodeproj/project.pbxproj client/flutter/macos/Runner.xcodeproj/project.pbxproj
          git commit -m 'identity: assign FuntiDesk Apple runtime IDs'
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
