name: identity-residual-audit

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 1
      - name: Product/runtime residuals
        shell: bash
        run: |
          set -u
          echo '=== UPPERCASE / USER-VISIBLE CANDIDATES ==='
          grep -RInE --exclude-dir=.dart_tool --exclude-dir=build --exclude='*.lock' \
            'RustDesk|RUSTDESK|rustdesk://|com\.carriez\.flutterHbb|Purslane Tech' \
            client/flutter/android client/flutter/ios client/flutter/macos client/flutter/linux \
            client/src/platform client/src 2>/dev/null | head -n 500 || true
          echo '=== PRODUCT PATH/SCHEME CANDIDATES ==='
          grep -RInE --exclude-dir=.dart_tool --exclude-dir=build --exclude='*.lock' \
            '(applicationId|PRODUCT_BUNDLE_IDENTIFIER|CFBundle(DisplayName|Name|URLName|URLSchemes)|android:(label|scheme)|\.app|ProgramData|Application Support|/usr/share/).*([Rr]ust[Dd]esk)' \
            client/flutter/android client/flutter/ios client/flutter/macos client/flutter/linux \
            client/src/platform client/src 2>/dev/null | head -n 300 || true
