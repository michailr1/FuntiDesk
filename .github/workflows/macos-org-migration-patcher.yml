    #[cfg(target_os = "macos")]
    fn path_for_macos_identity<P: AsRef<Path>>(org: &str, app_name: &str, p: P) -> PathBuf {
        // /var/root for root when called by the privileged service.
        if let Some(project) = directories_next::ProjectDirs::from("", org, app_name) {
            let mut path = patch(project.config_dir().to_path_buf());
            path.push(p);
            return path;
        }
        "".into()
    }
''')

          # Peer paths: factor the relative path so the same filename is used for both legacy org roots.
