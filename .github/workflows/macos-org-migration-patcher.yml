name: macos-org-migration-patcher

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Patch macOS org migration
        shell: python
        run: |
          from pathlib import Path

          p = Path('client/libs/hbb_common/src/config.rs')
          s = p.read_text()

          def repl(old, new, expected=1):
              global s
              count = s.count(old)
              if count not in (0, expected):
                  raise SystemExit(f'config.rs: expected 0 or {expected} occurrences, got {count}: {old[:100]!r}')
              if count == expected:
                  s = s.replace(old, new)

          repl('''#[cfg(target_os = "macos")]
lazy_static::lazy_static! {
    pub static ref ORG: RwLock<String> = RwLock::new("com.carriez".to_owned());
}
''', '''#[cfg(target_os = "macos")]
pub const FUNTIDESK_ORG: &str = "cc.funti";
#[cfg(target_os = "macos")]
pub const LEGACY_ORG: &str = "com.carriez";

#[cfg(target_os = "macos")]
lazy_static::lazy_static! {
    pub static ref ORG: RwLock<String> = RwLock::new(FUNTIDESK_ORG.to_owned());
}
''')

          repl('''    fn file_for_app(app_name: &str, suffix: &str) -> PathBuf {
        let name = format!("{app_name}{suffix}");
        Config::with_extension(Self::path_for_app(app_name, name))
    }
''', '''    fn file_for_app(app_name: &str, suffix: &str) -> PathBuf {
        let name = format!("{app_name}{suffix}");
        Config::with_extension(Self::path_for_app(app_name, name))
    }

    fn legacy_config_files(suffix: &str) -> Vec<PathBuf> {
        #[cfg(target_os = "macos")]
        {
            let current_name = format!("{FUNTIDESK_APP_NAME}{suffix}");
            let legacy_name = format!("{LEGACY_APP_NAME}{suffix}");
            return vec![
                Config::with_extension(Self::path_for_macos_identity(
                    LEGACY_ORG,
                    FUNTIDESK_APP_NAME,
                    current_name,
                )),
                Config::with_extension(Self::path_for_macos_identity(
                    LEGACY_ORG,
                    LEGACY_APP_NAME,
                    legacy_name,
                )),
            ];
        }
        #[cfg(not(target_os = "macos"))]
        {
            vec![Self::file_for_app(LEGACY_APP_NAME, suffix)]
        }
    }
''')

          repl('''        let cfg = if file.exists() {
            load_path(file)
        } else {
            let legacy_file = Self::file_for_app(LEGACY_APP_NAME, suffix);
            if legacy_file.exists() {
                let cfg = load_path(legacy_file.clone());
                match Self::copy_legacy_config_file(&legacy_file, &file) {
                    Ok(_) => log::info!(
                        "Migrated legacy config '{}' to '{}'",
                        legacy_file.display(),
                        file.display()
                    ),
                    Err(err) => log::warn!(
                        "Failed to migrate legacy config '{}' to '{}': {}",
                        legacy_file.display(),
                        file.display(),
                        err
                    ),
                }
                cfg
            } else {
                load_path(file)
            }
        };
''', '''        let cfg = if file.exists() {
            load_path(file)
        } else if let Some(legacy_file) = Self::legacy_config_files(suffix)
            .into_iter()
            .find(|candidate| {
                fs::symlink_metadata(candidate)
                    .map(|metadata| metadata.file_type().is_file())
                    .unwrap_or(false)
            })
        {
            let cfg = load_path(legacy_file.clone());
            match Self::copy_legacy_config_file(&legacy_file, &file) {
                Ok(_) => log::info!(
                    "Migrated legacy config '{}' to '{}'",
                    legacy_file.display(),
                    file.display()
                ),
                Err(err) => log::warn!(
                    "Failed to migrate legacy config '{}' to '{}': {}",
                    legacy_file.display(),
                    file.display(),
                    err
                ),
            }
            cfg
        } else {
            load_path(file)
        };
''')

          repl('''    fn path_for_app<P: AsRef<Path>>(app_name: &str, p: P) -> PathBuf {
        #[cfg(any(target_os = "android", target_os = "ios"))]
        {
            let mut path: PathBuf = APP_DIR.read().unwrap().clone().into();
            path.push(p);
            return path;
        }
        #[cfg(not(any(target_os = "android", target_os = "ios")))]
        {
            #[cfg(not(target_os = "macos"))]
            let org = "".to_owned();
            #[cfg(target_os = "macos")]
            let org = ORG.read().unwrap().clone();
            // /var/root for root
            if let Some(project) = directories_next::ProjectDirs::from("", &org, app_name) {
                let mut path = patch(project.config_dir().to_path_buf());
                path.push(p);
                return path;
            }
            "".into()
        }
    }
''', '''    fn path_for_app<P: AsRef<Path>>(app_name: &str, p: P) -> PathBuf {
