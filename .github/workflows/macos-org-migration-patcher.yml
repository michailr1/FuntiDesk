          p.write_text(s)

          # Privileged service config staging follows the new macOS org namespace.
          sp = Path('client/src/platform/privileges_scripts/install.scpt')
          t = sp.read_text()
          count = t.count('com.carriez.FuntiDesk')
          if count not in (0, 2):
              raise SystemExit(f'install.scpt: expected 0 or 2 com.carriez.FuntiDesk occurrences, got {count}')
          sp.write_text(t.replace('com.carriez.FuntiDesk', 'cc.funti.FuntiDesk'))

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'pub const FUNTIDESK_ORG: &str = "cc.funti";' client/libs/hbb_common/src/config.rs
          grep -Fq 'pub const LEGACY_ORG: &str = "com.carriez";' client/libs/hbb_common/src/config.rs
          grep -Fq 'RwLock::new(FUNTIDESK_ORG.to_owned())' client/libs/hbb_common/src/config.rs
          grep -Fq 'cc.funti.FuntiDesk' client/src/platform/privileges_scripts/install.scpt
          ! grep -Fq 'com.carriez.FuntiDesk' client/src/platform/privileges_scripts/install.scpt
          cargo fmt --manifest-path client/libs/hbb_common/Cargo.toml -- --check

      - name: Test hbb_common
        run: cargo test --manifest-path client/libs/hbb_common/Cargo.toml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/libs/hbb_common/src/config.rs client/src/platform/privileges_scripts/install.scpt
          git commit -m 'identity: migrate macOS config namespace to cc.funti' || exit 0
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
