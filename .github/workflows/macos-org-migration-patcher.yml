                Ok(_) => log::info!(
                    "Migrated legacy peer config '{}' to '{}'",
                    source.display(),
                    target.display()
                ),
                Err(err) => log::warn!(
                    "Failed to migrate legacy peer config '{}' to '{}': {}",
                    source.display(),
