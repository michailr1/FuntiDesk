          # Address book and group: prefer the intermediate FuntiDesk/com.carriez namespace,
          # then the original RustDesk/com.carriez namespace.
          for type_name, suffix in [('Ab', '_ab'), ('Group', '_group')]:
              marker = f'''    fn path_for_app(app_name: &str) -> PathBuf {{\n        let filename = format!("{{app_name}}{suffix}");\n        Config::path_for_app(app_name, filename)\n    }}\n'''
