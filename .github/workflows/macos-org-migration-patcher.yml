                Config::with_extension(Config::path_for_macos_identity(
                    LEGACY_ORG,
                    LEGACY_APP_NAME,
                    &rel,
                )),
            ];
        }
        #[cfg(not(target_os = "macos"))]
        {
            vec![Self::path_for_app(LEGACY_APP_NAME, id)]
        }
    }
