              repl(marker, extra)

          # Both readable_path implementations have the same legacy selection sequence.
          repl('''        let legacy = Self::path_for_app(LEGACY_APP_NAME);
        if !fs::symlink_metadata(&legacy)
            .map(|metadata| metadata.file_type().is_file())
