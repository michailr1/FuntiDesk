name: identity-runtime-residual-patcher

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Patch remaining direct runtime identity
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count not in (0, expected):
                  raise SystemExit(f'{path}: expected 0 or {expected} occurrences of {old!r}, got {count}')
              if count == expected:
                  p.write_text(text.replace(old, new))

          main = 'client/flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt'
          replace_exact(main, 'const val DEFAULT_NOTIFY_TITLE = "RustDesk"', 'const val DEFAULT_NOTIFY_TITLE = "FuntiDesk"', 1)
          replace_exact(main, '"rustdesk:wakelock"', '"funtidesk:wakelock"', 1)
          replace_exact(main, '"RustDeskVD"', '"FuntiDeskVD"', 1)
          replace_exact(main, 'val channelId = "RustDesk"', 'val channelId = "FuntiDesk"', 1)
          replace_exact(main, 'val channelName = "RustDesk Service"', 'val channelName = "FuntiDesk Service"', 1)
          replace_exact(main, 'description = "RustDesk Service Channel"', 'description = "FuntiDesk Service Channel"', 1)

          replace_exact('client/flutter/macos/Runner.xcodeproj/project.pbxproj',
                        'PRODUCT_BUNDLE_IDENTIFIER = com.carriez.rustdesk;',
                        'PRODUCT_BUNDLE_IDENTIFIER = cc.funti.funtidesk;', 3)
          replace_exact('client/flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme',
                        'BuildableName = "RustDesk.app"', 'BuildableName = "FuntiDesk.app"', 4)
          replace_exact('client/flutter/macos/Runner/Base.lproj/MainMenu.xib',
                        'customModule="RustDesk"', 'customModule="FuntiDesk"', 2)
          replace_exact('client/flutter/macos/Runner/MainFlutterWindow.swift',
                        '"RustDeskPlugin"', '"FuntiDeskPlugin"', 2)
          replace_exact('client/src/platform/macos.rs',
                        'let mount_point = "/Volumes/RustDeskUpdate";',
                        'let mount_point = "/Volumes/FuntiDeskUpdate";', 1)

          agent = 'client/src/platform/privileges_scripts/agent.plist'
          replace_exact(agent, 'com.carriez.RustDesk_server', 'cc.funti.funtidesk.server', 1)
          replace_exact(agent, 'com.carriez.rustdesk', 'cc.funti.funtidesk', 1)
          replace_exact(agent, '/Applications/RustDesk.app/Contents/MacOS/RustDesk',
                        '/Applications/FuntiDesk.app/Contents/MacOS/FuntiDesk', 1)
          replace_exact(agent, '/Applications/RustDesk.app/Contents/MacOS/',
                        '/Applications/FuntiDesk.app/Contents/MacOS/', 1)

          daemon = 'client/src/platform/privileges_scripts/daemon.plist'
          replace_exact(daemon, 'com.carriez.RustDesk_service', 'cc.funti.funtidesk.service', 1)
          replace_exact(daemon, 'com.carriez.rustdesk', 'cc.funti.funtidesk', 1)
          replace_exact(daemon, '/Applications/RustDesk.app/Contents/MacOS/service',
                        '/Applications/FuntiDesk.app/Contents/MacOS/service', 1)
          replace_exact(daemon, '/Applications/RustDesk.app/Contents/MacOS/',
                        '/Applications/FuntiDesk.app/Contents/MacOS/', 1)
          replace_exact(daemon, '/tmp/rustdesk_service.err', '/tmp/funtidesk_service.err', 1)
          replace_exact(daemon, '/tmp/rustdesk_service.out', '/tmp/funtidesk_service.out', 1)

          install = 'client/src/platform/privileges_scripts/install.scpt'
          replace_exact(install, '/Library/LaunchDaemons/com.carriez.RustDesk_service.plist',
                        '/Library/LaunchDaemons/cc.funti.funtidesk.service.plist', 3)
          replace_exact(install, '/Library/LaunchAgents/com.carriez.RustDesk_server.plist',
                        '/Library/LaunchAgents/cc.funti.funtidesk.server.plist', 2)
          replace_exact(install, '/Library/Preferences/com.carriez.RustDesk/RustDesk.toml',
                        '/Library/Preferences/com.carriez.FuntiDesk/FuntiDesk.toml', 1)
          replace_exact(install, '/Library/Preferences/com.carriez.RustDesk/RustDesk2.toml',
                        '/Library/Preferences/com.carriez.FuntiDesk/FuntiDesk2.toml', 1)
          replace_exact(install, 'RustDesk wants to install daemon and agent',
                        'FuntiDesk wants to install daemon and agent', 1)

          update = 'client/src/platform/privileges_scripts/update.scpt'
          replace_exact(update, '/Library/LaunchAgents/com.carriez.RustDesk_server.plist',
                        '/Library/LaunchAgents/cc.funti.funtidesk.server.plist', 1)
          replace_exact(update, '/Library/LaunchDaemons/com.carriez.RustDesk_service.plist',
                        '/Library/LaunchDaemons/cc.funti.funtidesk.service.plist', 1)
          replace_exact(update, '/Applications/RustDesk.app', '/Applications/FuntiDesk.app', 1)
          replace_exact(update, "pgrep -x 'RustDesk'", "pgrep -x 'FuntiDesk'", 1)
          replace_exact(update, 'RustDesk wants to update itself', 'FuntiDesk wants to update itself', 1)

          uninstall = 'client/src/platform/privileges_scripts/uninstall.scpt'
          replace_exact(uninstall, '/Library/LaunchDaemons/com.carriez.RustDesk_service.plist',
                        '/Library/LaunchDaemons/cc.funti.funtidesk.service.plist', 2)
          replace_exact(uninstall, '/Library/LaunchAgents/com.carriez.RustDesk_server.plist',
                        '/Library/LaunchAgents/cc.funti.funtidesk.server.plist', 1)
          replace_exact(uninstall, 'RustDesk wants to unload daemon', 'FuntiDesk wants to unload daemon', 1)

          for wb in ['client/src/whiteboard/macos.rs', 'client/src/whiteboard/windows.rs', 'client/src/whiteboard/linux.rs']:
              replace_exact(wb, '"RustDesk whiteboard"', '"FuntiDesk whiteboard"', 1)
          replace_exact('client/src/server/uinput.rs', '"RustDesk UInput Keyboard"', '"FuntiDesk UInput Keyboard"', 1)
          replace_exact('client/src/server/dbus.rs', '"RustDesk DBus Error: {}"', '"FuntiDesk DBus Error: {}"', 1)
          replace_exact('client/src/ui/index.tis', 'Copyright &copy; 2026 Purslane Tech Pte. Ltd.',
                        'Copyright &copy; 2026 FuntiDesk contributors.', 1)

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -Fq 'const val DEFAULT_NOTIFY_TITLE = "RustDesk"' client/flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          ! grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.carriez.rustdesk;' client/flutter/macos/Runner.xcodeproj/project.pbxproj
          ! grep -Fq 'BuildableName = "RustDesk.app"' client/flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          ! grep -Fq 'customModule="RustDesk"' client/flutter/macos/Runner/Base.lproj/MainMenu.xib
          ! grep -RInE 'com\.carriez\.RustDesk_(service|server)|/Applications/RustDesk\.app|RustDesk wants to' client/src/platform/privileges_scripts
          grep -Fq 'cc.funti.funtidesk.service' client/src/platform/privileges_scripts/daemon.plist
          grep -Fq 'cc.funti.funtidesk.server' client/src/platform/privileges_scripts/agent.plist
          grep -Fq 'FuntiDesk whiteboard' client/src/whiteboard/windows.rs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt \
                  client/flutter/macos/Runner.xcodeproj/project.pbxproj \
                  client/flutter/macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme \
                  client/flutter/macos/Runner/Base.lproj/MainMenu.xib \
                  client/flutter/macos/Runner/MainFlutterWindow.swift \
                  client/src/platform/macos.rs client/src/platform/privileges_scripts \
                  client/src/whiteboard client/src/server/uinput.rs client/src/server/dbus.rs client/src/ui/index.tis
          git commit -m 'identity: remove direct RustDesk runtime labels'
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
