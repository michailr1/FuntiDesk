name: Apply FuntiDesk Phase 2.6 plugin namespace

on:
  push:
    branches:
      - michailr/m2-funtidesk-identity-refactor
    paths:
      - ".github/workflows/apply-funtidesk-phase25.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: michailr/m2-funtidesk-identity-refactor
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/ci/apply-funtidesk-phase26.py

      - name: Format changed Rust file
        run: rustfmt --edition 2021 client/src/plugin/mod.rs

      - name: Validate hbb_common
        working-directory: client
        run: cargo check -p hbb_common --lib --locked

      - name: Validate patch
        run: |
          git diff --check
          git diff -- client/src/plugin/mod.rs

      - name: Audit plugin product namespace
        run: |
          grep -Fq 'get_plugins_dir_for("FuntiDesk")' client/src/plugin/mod.rs
          grep -Fq 'get_plugins_dir_for("RustDesk")' client/src/plugin/mod.rs
          grep -Fq 'Skipping symlink/reparse entry during legacy plugin migration' client/src/plugin/mod.rs

      - name: Commit phase 2.6 plugin namespace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/plugin/mod.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "identity: migrate plugin runtime namespace"
          git push origin HEAD:michailr/m2-funtidesk-identity-refactor
