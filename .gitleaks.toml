# Keep all default detectors. These exact public values were checked in the
# pinned native config and libsodium 0.8.4 source; neither file is excluded.
[extend]
useDefault = true

[allowlist]
description = "Public FuntiDesk trust anchor and exact libsodium API identifiers"
condition = "AND"
regexTarget = "secret"
paths = ['''^web-client/src/protocol\.js$''', '''^web/connect/session\.js$''']
regexes = [
  '''^2R3kWM1HR3BMoz3EB6KDmv5SjOKrDEVdrZXRcFWaDg4=$''',
  '''^crypto_aead_aegis256_decrypt$''',
  '''^crypto_aead_chacha20poly1305_decrypt$''',
  '''^crypto_aead_chacha20poly1305_keygen$''',
  '''^crypto_kdf_blake2b_BYTES_MAX$''',
  '''^crypto_kdf_hkdf_sha512_BYTES_MAX$''',
]
